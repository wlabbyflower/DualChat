name: Publish verified LPK

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version: //p' package.yml)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Retrieve verified LPK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p /tmp/release-assets
          git fetch --depth=1 origin "refs/heads/release-artifacts/v$VERSION"
          git archive FETCH_HEAD | tar -x -C /tmp/release-assets
          cat /tmp/release-assets/lpk.part.* > "dualchat-$VERSION.lpk"
          cp /tmp/release-assets/SHA256SUMS .
          sha256sum -c SHA256SUMS
          mv "dualchat-$VERSION.lpk" "DualChat-$VERSION.lpk"
          sha256sum "DualChat-$VERSION.lpk" > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          在同一远程桌面中使用 Telegram、WhatsApp Web 和 Discord Web。

          - 新增 Discord，使用独立目录保存浏览器登录资料。
          - 新增底部任务栏，支持启动应用、切换窗口、最小化及恢复。
          - 保留原有 Telegram、WhatsApp 数据路径。

          下载 LPK 后在懒猫微服中安装。请配置覆盖容器流量和 DNS 的系统 TUN。
          本地已验证应用启动、窗口切换和远程桌面访问；真实账号收发消息及语音通话尚未验证。
          EOF
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --target "$RELEASE_COMMIT" --title "DualChat $VERSION" --notes-file /tmp/release-notes.md --draft
          fi
          gh release upload "v$VERSION" "DualChat-$VERSION.lpk" SHA256SUMS --clobber
          gh release edit "v$VERSION" --draft=false --latest
