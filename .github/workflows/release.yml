name: Publish verified LPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version: //p' package.yml)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Retrieve verified LPK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p /tmp/release-assets
          git fetch --depth=1 origin "refs/heads/release-artifacts/v$VERSION"
          git archive FETCH_HEAD | tar -x -C /tmp/release-assets
          cat /tmp/release-assets/lpk.part.* > "dualchat-$VERSION.lpk"
          cp /tmp/release-assets/SHA256SUMS .
          sha256sum -c SHA256SUMS
          mv "dualchat-$VERSION.lpk" "DualChat-$VERSION.lpk"
          sha256sum "DualChat-$VERSION.lpk" > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --target "$RELEASE_COMMIT" --title "DualChat $VERSION" --notes-file RELEASE_NOTES.md --draft
          fi
          gh release upload "v$VERSION" "DualChat-$VERSION.lpk" SHA256SUMS --clobber
          gh release edit "v$VERSION" --draft=false --latest
