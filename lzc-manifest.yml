usage: |
  Telegram、WhatsApp 与 Discord 共用远程桌面。底部任务栏可启动应用、切换窗口、恢复最小化窗口。WhatsApp 使用手机扫码关联，Discord 使用官方网页版登录。
  应用不再内置代理；请先在微服系统配置覆盖应用容器流量的 TUN。
  升级后请将 Telegram 内的旧手动代理设置关闭。
application:
  subdomain: telegramv
  multi_instance: true
  gpu_accel: true
  routes:
    - /=http://telegramv:3000
services:
  telegramv:
    image: embed:messenger
    binds:
      # 保持旧版数据位置，避免升级后丢失 Telegram 会话。
      - /lzcapp/run/mnt/home/telegram:/config
      - /lzcapp/pkg/content/fonts:/usr/local/share/fonts/telegram
    environment:
      - LC_ALL=zh_CN.UTF-8
    shm_size: 4gb
ext_config:
  enable_document_access: true
